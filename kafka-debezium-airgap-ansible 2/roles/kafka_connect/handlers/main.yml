---
- name: Recharger systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Redémarrer kafka-connect
  ansible.builtin.systemd:
    name: kafka-connect
    enabled: true
    state: restarted
    daemon_reload: true

- name: Recharger firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true

