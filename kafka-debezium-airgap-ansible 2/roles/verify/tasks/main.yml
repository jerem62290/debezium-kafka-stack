---
- name: Contrôler le quorum KRaft
  ansible.builtin.command:
    argv:
      - "{{ kafka_install_dir }}/bin/kafka-metadata-quorum.sh"
      - --bootstrap-server
      - "{{ groups['kafka'][0] }}:{{ kafka_client_port }}"
      - --command-config
      - /etc/kafka/kraft/broker-client.properties
      - describe
      - --status
  delegate_to: "{{ groups['kafka'][0] }}"
  become: true
  register: verify_quorum
  retries: 20
  delay: 5
  until:
    - verify_quorum.rc == 0
    - verify_quorum.stdout is search('LeaderId')
    - verify_quorum.stdout is search('CurrentVoters')
  changed_when: false
  no_log: true
  environment:
    JAVA_HOME: "{{ java21_home }}"
    PATH: "{{ java21_home }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"

- name: Contrôler l'accès aux métadonnées Kafka
  ansible.builtin.command:
    argv:
      - "{{ kafka_install_dir }}/bin/kafka-topics.sh"
      - --bootstrap-server
      - "{{ groups['kafka'][0] }}:{{ kafka_client_port }}"
      - --command-config
      - /etc/kafka/kraft/broker-client.properties
      - --list
  delegate_to: "{{ groups['kafka'][0] }}"
  become: true
  register: verify_topics
  changed_when: false
  no_log: true
  environment:
    JAVA_HOME: "{{ java21_home }}"
    PATH: "{{ java21_home }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"

- name: Contrôler les plugins de chaque worker Connect
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ connect_rest_port }}/connector-plugins"
    return_content: true
    status_code: 200
  delegate_to: "{{ item }}"
  loop: "{{ groups['kafka_connect'] }}"
  register: verify_connect_plugins
  retries: 12
  delay: 5
  until:
    - verify_connect_plugins.status == 200
    - verify_connect_plugins.content is search('PostgresConnector')
    - verify_connect_plugins.content is search('OracleConnector')

- name: Contrôler Prometheus
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/-/ready"
    status_code: 200
  delegate_to: "{{ groups['monitoring'][0] }}"
  register: verify_prometheus
  retries: 12
  delay: 5
  until: verify_prometheus.status == 200

- name: Attendre que Prometheus voie toutes ses cibles essentielles
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/query?query=count(up%7Bjob%3D~%22node%7Ckafka-jmx%7Ckafka-connect-jmx%7Ckafka-exporter%22%7D%20%3D%3D%201)"
    return_content: true
    status_code: 200
  delegate_to: "{{ groups['monitoring'][0] }}"
  register: verify_prometheus_targets
  retries: 12
  delay: 5
  until:
    - verify_prometheus_targets.status == 200
    - verify_prometheus_targets.json.data.result | length == 1
    - verify_prometheus_targets.json.data.result[0].value[1] | int == expected_up_targets | int
  vars:
    expected_up_targets: >-
      {{ (groups['stack'] | length) + (groups['kafka'] | length) +
         (groups['kafka_connect'] | length) + 1 }}

- name: Contrôler Grafana
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    return_content: true
    status_code: 200
  delegate_to: "{{ groups['monitoring'][0] }}"
  register: verify_grafana
  retries: 12
  delay: 5
  until: verify_grafana.status == 200

- name: Contrôler AKHQ
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ akhq_port }}"
    timeout: 60
  delegate_to: "{{ groups['monitoring'][0] }}"

- name: Vérifier les ports toolbox depuis le contrôleur Ansible
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['monitoring'][0]].ansible_host }}"
    port: "{{ item }}"
    timeout: 30
  loop: "{{ [grafana_port, akhq_port, prometheus_port, alertmanager_port] }}"

- name: Vérifier l'API Connect distante depuis le contrôleur Ansible
  ansible.builtin.uri:
    url: "http://{{ hostvars[item].ansible_host }}:{{ connect_rest_port }}/connectors"
    use_proxy: false
    status_code: 200
  loop: "{{ groups['kafka_connect'] }}"

- name: Résumé de vérification
  ansible.builtin.debug:
    msg:
      - "Quorum KRaft : OK"
      - "Métadonnées Kafka : OK"
      - "Plugins Debezium PostgreSQL et Oracle : OK sur tous les workers"
      - "Prometheus, Grafana et AKHQ : OK"
      - "Ports admin accessibles depuis le contrôleur ; les autres réseaux doivent être testés depuis ces réseaux."
