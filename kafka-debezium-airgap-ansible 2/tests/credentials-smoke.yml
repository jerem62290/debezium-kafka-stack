---
- name: Tester les secrets persistants sans PKI ni artefact binaire
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Créer un état temporaire isolé
      ansible.builtin.tempfile:
        state: directory
        prefix: cdc-credentials-
      register: credential_test_dir
    - name: Définir le chemin de test
      ansible.builtin.set_fact:
        stack_state_dir: "{{ credential_test_dir.path }}"
        kafka_extra_clients: [consommateur-test]
    - name: Générer les secrets une première fois
      ansible.builtin.include_role:
        name: credentials
    - name: Mémoriser uniquement les empreintes du premier passage
      ansible.builtin.set_fact:
        credential_test_kafka_hash: "{{ kafka_sasl_passwords | to_json | hash('sha256') }}"
        credential_test_grafana_hash: "{{ grafana_admin_password | hash('sha256') }}"
        credential_test_jwt_hash: "{{ akhq_jwt_secret | hash('sha256') }}"
      no_log: true
    - name: Relire les secrets une deuxième fois
      ansible.builtin.include_role:
        name: credentials
    - name: Vérifier la stabilité des mots de passe
      ansible.builtin.assert:
        that:
          - credential_test_kafka_hash == kafka_sasl_passwords | to_json | hash('sha256')
          - credential_test_grafana_hash == grafana_admin_password | hash('sha256')
          - credential_test_jwt_hash == akhq_jwt_secret | hash('sha256')
          - "'consommateur-test' in kafka_sasl_passwords"
      no_log: true
    - name: Vérifier les permissions des secrets générés
      ansible.builtin.stat:
        path: "{{ stack_state_dir }}/sasl/{{ item }}"
      loop: "{{ kafka_sasl_users }}"
      register: credential_test_files
      no_log: true
    - name: Contrôler le mode privé de chaque mot de passe Kafka
      ansible.builtin.assert:
        that:
          - item.stat.mode == '0600'
      loop: "{{ credential_test_files.results }}"
      no_log: true
    - name: Vérifier l'absence de répertoire PKI
      ansible.builtin.stat:
        path: "{{ stack_state_dir }}/pki"
      register: credential_test_pki
    - name: Confirmer l'absence de génération PKI
      ansible.builtin.assert:
        that:
          - not credential_test_pki.stat.exists
    - name: Signaler la fin du test sans dévoiler les secrets
      ansible.builtin.debug:
        msg: "Secrets persistants et permissions OK ; état de test isolé sous {{ stack_state_dir }}."
