---
# Accès SSH : adaptez uniquement ce qui n'est pas fourni par votre configuration SSH.
ansible_user: ansible
# ansible_ssh_private_key_file: /chemin/vers/la/cle

# Le contrôleur Ansible conserve ici l'identifiant KRaft, les mots de passe et la PKI.
# Sauvegardez ce répertoire après le premier déploiement.
stack_state_dir: "{{ playbook_dir }}/.state"
airgap_bundle_dir: "{{ playbook_dir }}/airgap-bundle"

# L'installation ne crée aucun dépôt. Ces paquets doivent exister dans vos dépôts RHEL internes.
# Si cette liste est renseignée, tous les autres dépôts sont désactivés pendant les tâches DNF.
rhel_internal_repo_ids: []
common_rhel_packages:
  - bash
  - ca-certificates
  - chrony
  - curl
  - firewalld
  - gzip
  - openssl
  - procps-ng
  - tar
  - unzip
  - util-linux
java21_home: /usr/lib/jvm/jre-21-openjdk

# Réseau. Les interfaces d'administration restent locales par défaut : utilisez un tunnel SSH,
# ou remplacez 127.0.0.1 et renseignez ui_allowed_cidrs.
kafka_client_port: 9092
kafka_controller_port: 9093
kafka_jmx_exporter_port: 7071
connect_rest_port: 8083
connect_jmx_exporter_port: 7072
node_exporter_port: 9100
prometheus_port: 9090
alertmanager_port: 9093
grafana_port: 3000
akhq_port: 8080
kafka_exporter_port: 9308
blackbox_exporter_port: 9115
ui_bind_address: 127.0.0.1
ui_allowed_cidrs: []
kafka_additional_client_allowed_cidrs: []

# Kafka/KRaft.
kafka_version: 3.9.2
kafka_scala_version: "2.13"
kafka_install_dir: /opt/kafka
kafka_data_dir: /var/lib/kafka/data
kafka_metadata_dir: /var/lib/kafka/metadata
kafka_log_dir: /var/log/kafka
kafka_heap_opts: "-Xms4g -Xmx4g"
kafka_num_network_threads: 8
kafka_num_io_threads: 16
kafka_num_partitions: 12
kafka_log_retention_hours: 168
kafka_log_segment_bytes: 1073741824
kafka_acl_enabled: true

# Kafka Connect / Debezium.
debezium_version: 3.1.3.Final
connect_install_dir: /opt/kafka-connect
connect_plugin_dir: /opt/kafka-connect/plugins
connect_data_dir: /var/lib/kafka-connect
connect_log_dir: /var/log/kafka-connect
connect_heap_opts: "-Xms2g -Xmx2g"
connect_group_id: debezium-connect-cluster
connect_config_topic: _debezium-connect-configs
connect_offset_topic: _debezium-connect-offsets
connect_status_topic: _debezium-connect-status
connect_json_schemas_enable: true

# Observabilité / toolbox.
prometheus_retention_time: 30d
prometheus_retention_size: 40GB
grafana_domain: localhost
akhq_admin_user: admin
akhq_reader_user: lecture
akhq_context_path: /

# Pare-feu : les règles sont limitées aux IP déclarées dans l'inventaire.
# Passez manage_firewalld à false si la politique réseau est gérée ailleurs.
manage_firewalld: true

# SELinux n'est jamais désactivé. "enforcing" fait échouer le précontrôle si la VM ne l'est pas.
required_selinux_mode: enforcing

# Identités TLS clientes supplémentaires, facultatives. Elles seront créées dans .state/pki/clients.
# pki_extra_clients:
#   - nom-consommateur
pki_extra_clients: []
