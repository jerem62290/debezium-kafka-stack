---
- name: Tester localement la génération PKI
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    stack_state_dir: /tmp/cdc-stack-pki-test
    pki_extra_clients:
      - consommateur-test
  tasks:
    - name: Publier un mot de passe de test
      ansible.builtin.set_fact:
        kafka_keystore_password: TestPassword1234567890
    - name: Exécuter le rôle PKI
      ansible.builtin.include_role:
        name: pki_controller

