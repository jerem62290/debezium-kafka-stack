---
- name: "Créer le répertoire PKI de {{ pki_identity_name }}"
  ansible.builtin.file:
    path: "{{ pki_identity_dir }}/{{ pki_identity_name }}"
    state: directory
    mode: "0700"

- name: "Générer la clé de {{ pki_identity_name }}"
  ansible.builtin.command:
    argv:
      - openssl
      - genrsa
      - -out
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.key"
      - "3072"
  args:
    creates: "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.key"
  no_log: true

- name: "Protéger la clé de {{ pki_identity_name }}"
  ansible.builtin.file:
    path: "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.key"
    mode: "0600"

- name: "Générer la demande de certificat de {{ pki_identity_name }}"
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -sha384
      - -key
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.key"
      - -out
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.csr"
      - -subj
      - "/CN={{ pki_identity_cn }}/O=CDC Platform"
  args:
    creates: "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.csr"

- name: "Écrire les extensions de {{ pki_identity_name }}"
  ansible.builtin.template:
    src: certificate.ext.j2
    dest: "{{ pki_identity_dir }}/{{ pki_identity_name }}/certificate.ext"
    mode: "0600"

- name: "Signer le certificat de {{ pki_identity_name }}"
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -req
      - -sha384
      - -in
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.csr"
      - -CA
      - "{{ pki_ca_dir }}/ca.crt"
      - -CAkey
      - "{{ pki_ca_dir }}/ca.key"
      - -CAcreateserial
      - -out
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.crt"
      - -days
      - "{{ pki_certificate_days | string }}"
      - -extfile
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/certificate.ext"
  args:
    creates: "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.crt"
  no_log: true

- name: "Assembler la chaîne PEM de {{ pki_identity_name }}"
  ansible.builtin.shell: |
    set -o errexit -o nounset -o pipefail
    umask 077
    cat {{ (pki_identity_dir ~ '/' ~ pki_identity_name ~ '/tls.crt') | quote }} \
        {{ (pki_ca_dir ~ '/ca.crt') | quote }} \
      > {{ (pki_identity_dir ~ '/' ~ pki_identity_name ~ '/tls-chain.crt') | quote }}
  args:
    executable: /bin/bash
    creates: "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls-chain.crt"

- name: "Créer le keystore PKCS#12 de {{ pki_identity_name }}"
  ansible.builtin.command:
    argv:
      - openssl
      - pkcs12
      - -export
      - -name
      - "{{ pki_identity_cn }}"
      - -inkey
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.key"
      - -in
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.crt"
      - -certfile
      - "{{ pki_ca_dir }}/ca.crt"
      - -out
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/keystore.p12"
      - -passout
      - "pass:{{ hostvars['localhost'].kafka_keystore_password }}"
  args:
    creates: "{{ pki_identity_dir }}/{{ pki_identity_name }}/keystore.p12"
  no_log: true

- name: "Vérifier la chaîne de certificat de {{ pki_identity_name }}"
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -CAfile
      - "{{ pki_ca_dir }}/ca.crt"
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/tls.crt"
  changed_when: false

- name: "Vérifier le keystore PKCS#12 de {{ pki_identity_name }}"
  ansible.builtin.command:
    argv:
      - openssl
      - pkcs12
      - -in
      - "{{ pki_identity_dir }}/{{ pki_identity_name }}/keystore.p12"
      - -passin
      - "pass:{{ hostvars['localhost'].kafka_keystore_password }}"
      - -noout
  changed_when: false
  no_log: true
