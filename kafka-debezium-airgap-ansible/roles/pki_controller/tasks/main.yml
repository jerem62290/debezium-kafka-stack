---
- name: Définir les chemins PKI
  ansible.builtin.set_fact:
    pki_root: "{{ stack_state_dir }}/pki"
    pki_ca_dir: "{{ stack_state_dir }}/pki/ca"
    pki_identity_dir: "{{ stack_state_dir }}/pki/identities"

- name: Créer l'arborescence PKI privée
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ pki_ca_dir }}"
    - "{{ pki_identity_dir }}"

- name: Générer la clé de l'autorité interne
  ansible.builtin.command:
    argv:
      - openssl
      - genrsa
      - -out
      - "{{ pki_ca_dir }}/ca.key"
      - "4096"
  args:
    creates: "{{ pki_ca_dir }}/ca.key"
  no_log: true

- name: Protéger la clé de l'autorité interne
  ansible.builtin.file:
    path: "{{ pki_ca_dir }}/ca.key"
    mode: "0600"

- name: Générer le certificat de l'autorité interne
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -new
      - -sha384
      - -key
      - "{{ pki_ca_dir }}/ca.key"
      - -out
      - "{{ pki_ca_dir }}/ca.crt"
      - -days
      - "{{ pki_ca_days | string }}"
      - -subj
      - "/CN={{ pki_ca_common_name }}/O=CDC Platform"
  args:
    creates: "{{ pki_ca_dir }}/ca.crt"

- name: Générer les certificats des brokers
  ansible.builtin.include_tasks: identity.yml
  vars:
    pki_identity_name: "{{ item }}"
    pki_identity_cn: "{{ item }}"
    pki_identity_profile: broker
    pki_identity_address: "{{ hostvars[item].ansible_host }}"
  loop: "{{ groups['kafka'] }}"
  loop_control:
    label: "broker {{ item }}"

- name: Générer les certificats clients Kafka Connect
  ansible.builtin.include_tasks: identity.yml
  vars:
    pki_identity_name: "{{ item }}"
    pki_identity_cn: "{{ item }}"
    pki_identity_profile: client
    pki_identity_address: "{{ hostvars[item].ansible_host }}"
  loop: "{{ groups['kafka_connect'] }}"
  loop_control:
    label: "connect {{ item }}"

- name: Générer les certificats clients de la toolbox
  ansible.builtin.include_tasks: identity.yml
  vars:
    pki_identity_name: "{{ item }}"
    pki_identity_cn: "{{ item }}"
    pki_identity_profile: client
    pki_identity_address: "{{ hostvars[groups['monitoring'][0]].ansible_host }}"
  loop:
    - akhq
    - kafka-exporter
  loop_control:
    label: "client {{ item }}"

- name: Générer les certificats clients supplémentaires
  ansible.builtin.include_tasks: identity.yml
  vars:
    pki_identity_name: "client-{{ item }}"
    pki_identity_cn: "{{ item }}"
    pki_identity_profile: client
    pki_identity_address: ""
  loop: "{{ pki_extra_clients }}"
  loop_control:
    label: "client {{ item }}"

