---
- name: Déterminer l'identifiant KRaft du nœud
  ansible.builtin.set_fact:
    kafka_node_id: "{{ (groups['kafka'] | sort).index(inventory_hostname) + 1 }}"

- name: Rechercher le groupe Kafka dans les sources NSS
  ansible.builtin.getent:
    database: group
    key: "{{ kafka_service_group }}"
    fail_key: false

- name: Rechercher le compte Kafka dans les sources NSS
  ansible.builtin.getent:
    database: passwd
    key: "{{ kafka_service_user }}"
    fail_key: false

- name: Créer le groupe Kafka uniquement s'il est absent
  ansible.builtin.group:
    name: "{{ kafka_service_group }}"
    system: true
  when: ansible_facts.getent_group[kafka_service_group] is none

- name: Créer le compte Kafka uniquement s'il est absent
  ansible.builtin.user:
    name: "{{ kafka_service_user }}"
    group: "{{ kafka_service_group }}"
    system: true
    shell: /sbin/nologin
    home: "{{ kafka_data_dir }}"
    create_home: false
  when: ansible_facts.getent_passwd[kafka_service_user] is none

- name: Créer les répertoires Kafka
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(kafka_service_user) }}"
    group: "{{ item.group | default(kafka_service_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ kafka_install_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ kafka_config_dir }}", owner: root, group: "{{ kafka_service_group }}", mode: "0750"}
    - {path: "{{ kafka_data_dir }}", mode: "0750"}
    - {path: "{{ kafka_metadata_dir }}", mode: "0750"}
    - {path: "{{ kafka_log_dir }}", mode: "0750"}
    - {path: "{{ jmx_exporter_install_dir }}", owner: root, group: root, mode: "0755"}

- name: Adapter les propriétaires des données lors d'un changement de compte ou de chemins
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_service_user }}"
    group: "{{ kafka_service_group }}"
    recurse: true
    follow: false
  loop: "{{ [kafka_data_dir, kafka_metadata_dir, kafka_log_dir] }}"
  when: kafka_layout_changed | default(false) | bool
  # Le garde exécuté avant toute mutation a imposé l'arrêt du broker.
  # Aucun chmod récursif et aucun changement de propriétaire des parents partagés.

- name: Lire les options du montage des exécutables Kafka
  ansible.builtin.command:
    argv: [findmnt, -n, -o, OPTIONS, --target, "{{ kafka_install_dir }}"]
  register: kafka_install_mount
  changed_when: false

- name: Refuser un montage noexec pour les binaires Kafka
  ansible.builtin.assert:
    that:
      - "'noexec' not in kafka_install_mount.stdout.strip().split(',')"
    fail_msg: >-
      Le montage contenant {{ kafka_install_dir }} est noexec. Faites adapter ce montage
      avant le déploiement ; une règle SELinux ne corrige pas cette restriction.

- name: Installer Kafka depuis le bundle air-gap
  ansible.builtin.unarchive:
    src: "{{ airgap_bundle_dir }}/artifacts/kafka/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
    dest: "{{ kafka_install_dir }}"
    owner: root
    group: root
    remote_src: false
    extra_opts:
      - --strip-components=1
    creates: "{{ kafka_install_dir }}/bin/kafka-server-start.sh"
  notify: Redémarrer kafka

- name: Installer l'agent JMX Exporter
  ansible.builtin.copy:
    src: "{{ airgap_bundle_dir }}/artifacts/monitoring/jmx_prometheus_javaagent-{{ jmx_exporter_version }}.jar"
    dest: "{{ jmx_exporter_install_dir }}/jmx_prometheus_javaagent-{{ jmx_exporter_version }}.jar"
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer kafka

- name: Configurer Kafka KRaft
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_config_dir }}/server.properties"
    owner: root
    group: "{{ kafka_service_group }}"
    mode: "0640"
  no_log: true
  notify: Redémarrer kafka

- name: Configurer le client d'administration local
  ansible.builtin.template:
    src: broker-client.properties.j2
    dest: "{{ kafka_config_dir }}/broker-client.properties"
    owner: root
    group: "{{ kafka_service_group }}"
    mode: "0640"
  no_log: true

- name: Configurer l'export JMX Kafka
  ansible.builtin.template:
    src: kafka-jmx-exporter.yml.j2
    dest: "{{ kafka_config_dir }}/jmx-exporter.yml"
    owner: root
    group: "{{ kafka_service_group }}"
    mode: "0644"
  notify: Redémarrer kafka

- name: Configurer la journalisation Kafka
  ansible.builtin.template:
    src: log4j2.yaml.j2
    dest: "{{ kafka_config_dir }}/log4j2.yaml"
    owner: root
    group: "{{ kafka_service_group }}"
    mode: "0644"
  notify: Redémarrer kafka

- name: Installer le service systemd Kafka
  ansible.builtin.template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Recharger systemd
    - Redémarrer kafka

- name: Adapter les contextes SELinux avant tout accès Kafka
  ansible.builtin.include_tasks: selinux.yml
  when: kafka_manage_selinux | bool

- name: Vérifier les droits Unix du compte de service avant de démarrer
  ansible.builtin.command:
    argv:
      - /usr/sbin/runuser
      - -u
      - "{{ kafka_service_user }}"
      - -g
      - "{{ kafka_service_group }}"
      - --
      - /usr/bin/test
      - "{{ item.access }}"
      - "{{ item.path }}"
  loop:
    - {path: "{{ kafka_install_dir }}/bin/kafka-server-start.sh", access: "-x"}
    - {path: "{{ kafka_config_dir }}/server.properties", access: "-r"}
    - {path: "{{ kafka_data_dir }}", access: "-w"}
    - {path: "{{ kafka_metadata_dir }}", access: "-w"}
    - {path: "{{ kafka_log_dir }}", access: "-w"}
  changed_when: false
  # runuser contrôle aussi la traversée de tous les parents, sans leur imposer chmod/chown.

- name: Détecter un stockage KRaft déjà formaté
  ansible.builtin.stat:
    path: "{{ kafka_metadata_dir }}/meta.properties"
  register: kraft_metadata

- name: Lire les métadonnées KRaft existantes
  ansible.builtin.slurp:
    src: "{{ item }}/meta.properties"
  loop: "{{ [kafka_metadata_dir, kafka_data_dir] }}"
  register: kafka_existing_metadata
  when: kraft_metadata.stat.exists

- name: Refuser un cluster ID ou node ID incohérent
  ansible.builtin.assert:
    that:
      - (item.content | b64decode) is search('(?m)^cluster.id=' ~ (hostvars['localhost'].kraft_cluster_id | regex_escape) ~ '$')
      - (item.content | b64decode) is search('(?m)^node.id=' ~ (kafka_node_id | string) ~ '$')
    fail_msg: >-
      meta.properties ne correspond pas au cluster ID conservé dans .state ou au node.id
      calculé. N'effacez pas les données : restaurez le bon .state ou corrigez l'inventaire.
  loop: "{{ kafka_existing_metadata.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: kraft_metadata.stat.exists

- name: Formater le stockage KRaft une seule fois
  ansible.builtin.command:
    argv:
      - /usr/sbin/runuser
      - -u
      - "{{ kafka_service_user }}"
      - -g
      - "{{ kafka_service_group }}"
      - --
      - "{{ kafka_install_dir }}/bin/kafka-storage.sh"
      - format
      - --cluster-id
      - "{{ hostvars['localhost'].kraft_cluster_id }}"
      - --config
      - "{{ kafka_config_dir }}/server.properties"
  become: true
  environment:
    JAVA_HOME: "{{ java21_home }}"
    PATH: "{{ java21_home }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
  when: not kraft_metadata.stat.exists
  changed_when: true
  no_log: true
  notify: Redémarrer kafka

- name: Autoriser le trafic client Kafka
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--add-rich-rule=rule family=ipv4 source address={{ item }} port port={{ kafka_client_port }} protocol=tcp accept"
  loop: "{{ kafka_client_allowed_cidrs | unique }}"
  register: kafka_client_firewall
  changed_when: "'ALREADY_ENABLED' not in (kafka_client_firewall.stdout ~ kafka_client_firewall.stderr)"
  notify: Recharger firewalld
  when: manage_firewalld | bool

- name: Autoriser le quorum KRaft entre brokers
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--add-rich-rule=rule family=ipv4 source address={{ hostvars[item].ansible_host }}/32 port port={{ kafka_controller_port }} protocol=tcp accept"
  loop: "{{ groups['kafka'] }}"
  register: kafka_controller_firewall
  changed_when: "'ALREADY_ENABLED' not in (kafka_controller_firewall.stdout ~ kafka_controller_firewall.stderr)"
  notify: Recharger firewalld
  when: manage_firewalld | bool

- name: Autoriser le scraping JMX Kafka
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--add-rich-rule=rule family=ipv4 source address={{ hostvars[groups['monitoring'][0]].ansible_host }}/32 port port={{ kafka_jmx_exporter_port }} protocol=tcp accept"
  register: kafka_jmx_firewall
  changed_when: "'ALREADY_ENABLED' not in (kafka_jmx_firewall.stdout ~ kafka_jmx_firewall.stderr)"
  notify: Recharger firewalld
  when: manage_firewalld | bool

- name: Appliquer les handlers avant le contrôle de disponibilité
  ansible.builtin.meta: flush_handlers

- name: Activer le service Kafka
  ansible.builtin.systemd:
    name: kafka
    enabled: true
    state: started
    daemon_reload: true
