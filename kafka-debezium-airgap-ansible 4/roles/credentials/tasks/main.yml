---
- name: Créer les répertoires privés de secrets sur le contrôleur
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ stack_state_dir }}"
    - "{{ stack_state_dir }}/secrets"
    - "{{ stack_state_dir }}/sasl"

- name: Construire la liste des identités Kafka
  ansible.builtin.set_fact:
    kafka_sasl_users: "{{ (groups['kafka'] + groups['kafka_connect'] + ['akhq', 'kafka-exporter'] + kafka_extra_clients) | sort }}"

- name: Refuser les doublons et les overrides inconnus
  ansible.builtin.assert:
    that:
      - kafka_sasl_users | length == kafka_sasl_users | unique | length
      - (kafka_sasl_password_overrides | default({})).keys() | difference(kafka_sasl_users) | length == 0
    fail_msg: Les comptes SASL doivent être uniques et les overrides doivent viser un compte déclaré.
  no_log: true

- name: Valider les noms avant de créer les fichiers de secrets et la configuration JAAS
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z][A-Za-z0-9._-]{0,127}$')
    fail_msg: Les identités SASL doivent commencer par une lettre et ne contenir que lettres, chiffres, points, tirets et underscores.
  loop: "{{ kafka_sasl_users }}"

- name: Charger ou générer les secrets des interfaces
  ansible.builtin.set_fact:
    "{{ item }}": "{{ vars[item ~ '_override'] | default(lookup('ansible.builtin.password', stack_state_dir ~ '/secrets/' ~ item ~ ' length=64 chars=ascii_letters,digits'), true) }}"
  loop:
    - grafana_admin_password
    - akhq_admin_password
    - akhq_reader_password
    - akhq_jwt_secret
  no_log: true

- name: Initialiser le dictionnaire des mots de passe Kafka
  ansible.builtin.set_fact:
    kafka_sasl_passwords: {}
  no_log: true

- name: Charger ou générer les mots de passe Kafka persistants
  ansible.builtin.set_fact:
    kafka_sasl_passwords: >-
      {{ kafka_sasl_passwords | combine({item:
         (kafka_sasl_password_overrides | default({})).get(item,
         lookup('ansible.builtin.password', stack_state_dir ~ '/sasl/' ~ item ~ ' length=64 chars=ascii_letters,digits'))}) }}
  loop: "{{ kafka_sasl_users }}"
  no_log: true

- name: Valider le format des secrets pour les fichiers de configuration
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[A-Za-z0-9]{16,128}$')
    fail_msg: Les secrets doivent contenir 16 à 128 caractères alphanumériques.
  loop: "{{ (kafka_sasl_passwords.values() | list) + [grafana_admin_password, akhq_admin_password, akhq_reader_password] }}"
  no_log: true

- name: Valider la longueur de la clé de signature AKHQ
  ansible.builtin.assert:
    that:
      - akhq_jwt_secret is match('^[A-Za-z0-9]{32,128}$')
  no_log: true
