---
- name: Créer le groupe node_exporter
  ansible.builtin.group:
    name: node_exporter
    system: true

- name: Créer l'utilisateur node_exporter
  ansible.builtin.user:
    name: node_exporter
    group: node_exporter
    system: true
    shell: /sbin/nologin
    home: /var/lib/node_exporter
    create_home: false

- name: Créer le répertoire node_exporter
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Installer node_exporter depuis le bundle
  ansible.builtin.unarchive:
    src: "{{ airgap_bundle_dir }}/artifacts/monitoring/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "{{ node_exporter_install_dir }}"
    remote_src: false
    extra_opts:
      - --strip-components=1
    creates: "{{ node_exporter_install_dir }}/node_exporter"
  notify: Redémarrer node_exporter

- name: Installer le service node_exporter
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Recharger systemd
    - Redémarrer node_exporter

- name: Autoriser le scraping depuis Prometheus
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--add-rich-rule=rule family=ipv4 source address={{ hostvars[groups['monitoring'][0]].ansible_host }}/32 port port={{ node_exporter_port }} protocol=tcp accept"
  register: node_exporter_firewall
  changed_when: "'ALREADY_ENABLED' not in (node_exporter_firewall.stdout ~ node_exporter_firewall.stderr)"
  notify: Recharger firewalld
  when: manage_firewalld | bool

- name: Activer node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
